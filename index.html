/* Layout: sticky brand bar; left 30% navigation of the four parts (drawer on phones); right 70% reading column with toolbar, blocks and prev/next */
:root{
  --brand:#7AB8E4; --brand-deep:#5692BD; --ink-accent:#245A7C;
  --bg:#F5FBFF; --surface:#FFFFFF; --soft:#EAF6FF; --soft-2:#DCF0FF; --line:#B9DDF3;
  --fg:#1F2A33; --muted:#52606B; --on-brand:#FFFFFF;
  --gold:#FFCF47; --warn-bg:#FFF4D6; --warn-line:#FFCF47; --warn-icon:#9A6A00; --warn-fg:#5F4300;
  --lock:#8A99A6; --mark:#FFE58F; --scrim:rgba(20,40,56,.42); --shadow:rgba(36,90,124,.14);
  --font-display:"e-Ukraine Head","Geologica",system-ui,sans-serif;
  --font-body:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar-h:64px; --fs:1; --gut:min(150px,9vw);
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
a{color:var(--ink-accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--brand);color:var(--on-brand)}
.bar-in{height:var(--bar-h);display:flex;align-items:center;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px),var(--gut));padding-right:max(16px,env(safe-area-inset-right,0px),var(--gut))}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:inherit;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.burger{display:none}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;flex:none}
.brand svg{height:34px;width:auto;flex:none}
.brand-sep{width:1.5px;height:30px;background:rgba(255,255,255,.55)}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.2px;white-space:nowrap}
.proto{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;background:var(--gold);color:#1F2A33;padding:3px 9px;border-radius:20px;white-space:nowrap}
.search{position:relative;flex:1;min-width:0;max-width:440px;margin-left:auto}
.search-field{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 14px;background:var(--surface);color:var(--fg);border-radius:24px;border:1.5px solid transparent}
.search-field:focus-within{border-color:var(--gold)}
.search-field svg{color:var(--brand-deep)}
.search-field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px}
.search-field input::placeholder{color:var(--muted)}
.kbd{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.hotline{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;padding:8px 14px;border-radius:24px;border:1.5px solid rgba(255,255,255,.6);background:transparent;cursor:pointer;color:inherit}
.hotline b{font-weight:600;font-variant-numeric:tabular-nums}
.hotline:hover{background:rgba(255,255,255,.14)}
.search-toggle{display:none}
.results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px var(--shadow);max-height:min(70vh,560px);overflow:auto;padding:8px}
.results-head{font-size:13px;color:var(--muted);padding:8px 12px 6px}
.res{display:flex;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;border:0;background:transparent;cursor:pointer}
.res:hover,.res[aria-selected="true"]{background:var(--soft)}
.res .n{flex:none;min-width:44px;font-family:var(--font-display);font-weight:700;color:var(--ink-accent);font-size:15px}
.res .t{font-weight:600;font-size:15px}
.res .s{font-size:14px;color:var(--muted);margin-top:2px}
.res.locked .n,.res.locked .t{color:var(--lock)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.res-empty{padding:18px 12px;color:var(--muted);font-size:15px}

/* shell */
.shell{display:grid;grid-template-columns:minmax(290px,30%) minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px),var(--gut));padding-right:max(16px,env(safe-area-inset-right,0px),var(--gut))}
.side{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));align-self:start;height:calc(100dvh - var(--bar-h) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;border-right:1.5px solid var(--line);padding:24px 22px 32px 8px;overscroll-behavior:contain}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px 10px}
.side-close{display:none}
.side-label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.linkbtn{border:0;background:none;color:var(--ink-accent);font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px}

/* responsive */

}

/* ---------- index ---------- */
const SUBS=[],BYID={};
PARTS.forEach(p=>p.subs.forEach(s=>{const o={num:s[0],title:s[1],pages:s[2],id:s[3]||null,part:p};SUBS.push(o);if(o.id)BYID[o.id]=o;}));
const ACTIVE=SUBS.filter(s=>s.id);
const strip=h=>h.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
function blockText(b){
  let out=[];
  if(b.h)out.push(strip(b.h));if(b.x)out.push(b.x);if(b.title)out.push(b.title);if(b.text)out.push(b.text);
  if(b.items)b.items.forEach(i=>out.push(typeof i==="string"?i:[i.t,i.d,i.title,i.h,i.big,i.lab,i.sub].filter(Boolean).join(" ")));
  if(b.rows)b.rows.forEach(r=>out.push(r.join(" ")));
  if(b.tabs)b.tabs.forEach(t=>{out.push(t.label);t.blocks.forEach(x=>out.push(blockText(x)));});
  return out.join(" ");
}
ACTIVE.forEach(s=>{s.text=PAGES[s.id].blocks.map(blockText).join(" ");});
const norm=s=>s.toLowerCase().replace(/[’ʼ`']/g,"'").replace(/ё/g,"е");

let fs=store.get("fs",0);

/* ---------- render: tree ---------- */
function renderTree(){
  const cur=currentId();
  $("#tree").innerHTML=PARTS.map(p=>{
    const ready=p.subs.filter(s=>s[3]).length;
    return '<div class="part'+(openParts.has(p.id)?' open':'')+'" data-part="'+p.id+'">'+
     '<button class="part-btn" aria-expanded="'+openParts.has(p.id)+'" aria-controls="subs-'+p.id+'"><span class="roman">'+p.n+'</span><span class="part-title">'+p.title+'<span class="part-meta">'+p.subs.length+' підрозділів · '+p.pages+'</span></span>'+ic("chev","chev")+'</button>'+
     '<ul class="subs" id="subs-'+p.id+'">'+p.subs.map(s=>{
       const id=s[3];
       if(id){const demo=PAGES[id].demo;return '<li><button class="sub" data-go="'+id+'"'+(cur===id?' aria-current="page"':'')+'><span class="num">'+s[0]+'</span><span>'+s[1]+'</span>'+(demo?'<span class="demo">Демо</span>':'')+'</button></li>';}
       return '<li><button class="sub locked" data-locked="'+s[0]+'" aria-disabled="true" title="У розробці"><span class="num">'+s[0]+'</span><span>'+s[1]+'</span>'+ic("lock","lk")+'<span class="sr">, у розробці</span></button></li>';
     }).join("")+'</ul></div>';
  }).join("");
  $("#homeBtn").toggleAttribute("aria-current",!cur);
  if(!cur)$("#homeBtn").setAttribute("aria-current","page");
  $("#toggleAll").textContent=openParts.size===PARTS.length?"Згорнути все":"Розгорнути все";
}
$("#tree").addEventListener("click",e=>{
  const pb=e.target.closest(".part-btn");
  if(pb){const id=pb.parentNode.dataset.part;openParts.has(id)?openParts.delete(id):openParts.add(id);store.set("open",[...openParts]);renderTree();return;}
  const go=e.target.closest("[data-go]");if(go){navigate(go.dataset.go);return;}
  const lk=e.target.closest("[data-locked]");if(lk){toast("Підрозділ "+lk.dataset.locked+" у розробці. Його текст з’явиться в робочій версії пам’ятки.");}
});
$("#toggleAll").addEventListener("click",()=>{openParts=openParts.size===PARTS.length?new Set():new Set(PARTS.map(p=>p.id));store.set("open",[...openParts]);renderTree();});
$("#homeBtn").addEventListener("click",()=>navigate(""));

/* ---------- render: blocks ---------- */
function rb(b){
  switch(b.t){
   case "p":return "<p>"+b.h+"</p>";
   case "h2":return '<h2 id="h-'+b.id+'">'+b.x+"</h2>";
   case "h3":return "<h3>"+b.x+"</h3>";
   case "law":return '<div class="law"><span class="src">'+b.src+"</span><p>"+b.h+"</p></div>";
   case "note":return '<div class="note '+(b.k==="warn"?"warn":"")+'">'+ic(b.k==="warn"?"alert":"info")+'<div><span class="nt">'+b.title+"</span><p>"+b.h+"</p></div></div>";
   case "steps":return '<ol class="steps">'+b.items.map((s,i)=>'<li><span class="c">'+(i+1)+'</span><div><div class="st">'+s.t+'</div><div class="sd">'+s.d+"</div></div></li>").join("")+"</ol>";
   case "cards":return '<div class="cards">'+b.items.map(c=>'<div class="card"><div class="big">'+c.big+'</div><div class="lab">'+c.lab+"</div>"+(c.sub?'<div class="sub2">'+c.sub+"</div>":"")+"</div>").join("")+"</div>";
   case "duo":return '<div class="duo">'+b.items.map(c=>'<div class="card"><h3>'+ic(c.icon)+c.title+"</h3><p>"+c.h+"</p></div>").join("")+"</div>";
   case "chk":return '<ul class="chk">'+b.items.map(i=>"<li>"+ic("check")+"<span>"+i+"</span></li>").join("")+"</ul>";
   case "table":return '<div class="tbl"><table><thead><tr>'+b.head.map(h=>"<th>"+h+"</th>").join("")+"</tr></thead><tbody>"+b.rows.map(r=>"<tr>"+r.map((c,i)=>"<td"+(i&&/\d/.test(c)&&c.length<14?' class="num"':"")+">"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
   case "doc":return '<div class="doc"><div class="doc-head"><b>'+ic("doc")+b.title+'</b><button class="btn" data-copydoc>'+ic("copy")+'<span>Скопіювати текст</span></button></div><pre>'+b.text.replace(/</g,"&lt;")+"</pre></div>";
   case "files":return '<div class="files">'+b.items.map(f=>'<a class="file" href="'+f.href+'" target="_blank" rel="noopener"><span class="ext">'+f.ext+"</span><span>"+f.title+"</span>"+ic("ext")+"</a>").join("")+"</div>";
   case "grid":return '<div class="grid3">'+b.items.map(g=>'<div class="g">'+ic(g.icon)+"<span>"+g.h+"</span></div>").join("")+"</div>";
   case "xref":{const s=BYID[b.to];return '<button class="xref" data-go="'+b.to+'">'+ic("link")+'<span>Див. також <span class="n">'+s.num+"</span> "+b.h+"</span>"+ic("right")+"</button>";}
   case "tabs":{const k="t"+Math.random().toString(36).slice(2,7);return '<div class="tabs"><div class="tablist" role="tablist">'+b.tabs.map((t,i)=>'<button class="tab" role="tab" id="'+k+i+'" aria-controls="'+k+"p"+i+'" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'">'+t.label+"</button>").join("")+"</div>"+b.tabs.map((t,i)=>'<div class="tabpanel" role="tabpanel" id="'+k+"p"+i+'" aria-labelledby="'+k+i+'"'+(i?" hidden":"")+">"+t.blocks.map(rb).join("")+"</div>").join("")+"</div>";}
  }
  return "";
}

  (h2s.length>1?'<div class="toc" aria-label="Зміст підрозділу">'+h2s.map(h=>'<button data-jump="h-'+h.id+'">'+h.x+"</button>").join("")+"</div>":"")+
  '<article class="body" id="art">'+pg.blocks.map(rb).join("")+"</article>"+
  '<nav class="pager" aria-label="Інші підрозділи"><button class="pg" data-go="'+(prev?prev.id:"")+'"'+(prev?"":" hidden")+"><small>"+ic("left")+"Попередній</small><span>"+(prev?prev.num+" "+prev.title:"")+'</span></button><button class="pg next" data-go="'+(next?next.id:"")+'"'+(next?"":" hidden")+"><small>Наступний"+ic("right")+"</small><span>"+(next?next.num+" "+next.title:"")+"</span></button></nav>";
  glossify($("#art"));
  $("#copyLink").addEventListener("click",()=>copyText(location.href,"Посилання на підрозділ "+s.num+" скопійовано"));
  applyFs();
}

function render(){
  const id=currentId();
  closeDrawer();closePop();
  if(id){renderPage(id);const part=BYID[id].part.id;if(!openParts.has(part)){openParts.add(part);store.set("open",[...openParts]);}}
  else renderHome();
  renderTree();
  window.scrollTo({top:0,behavior:"auto"});
  updateProgress();
}
function navigate(id){
  if(id===currentId()){render();return;}
  if(id)location.hash=id;else{history.replaceState(null,"",location.pathname+location.search);render();}
}
window.addEventListener("hashchange",()=>{render();const t=$("#pt");if(t)t.focus({preventScroll:true});});

/* delegated clicks in view */
$("#view").addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go&&go.dataset.go){navigate(go.dataset.go);return;}
  if(e.target.closest("[data-home]")){navigate("");return;}
  const pgo=e.target.closest("[data-part-go]");if(pgo){const p=PARTS.find(x=>x.id===pgo.dataset.partGo);const first=p.subs.find(s=>s[3]);openParts.add(p.id);store.set("open",[...openParts]);navigate(first[3]);return;}
  const j=e.target.closest("[data-jump]");if(j){const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return;}
  if(e.target.closest("[data-report]")){openReport();return;}
  const cd=e.target.closest("[data-copydoc]");if(cd){copyText(cd.closest(".doc").querySelector("pre").textContent,"Текст зразка скопійовано");return;}
  const tab=e.target.closest(".tab");if(tab){selectTab(tab);return;}
  if(e.target.id==="fsMinus"){fs=Math.max(0,fs-1);store.set("fs",fs);applyFs();return;}
  if(e.target.id==="fsPlus"){fs=Math.min(FS.length-1,fs+1);store.set("fs",fs);applyFs();return;}
  const term=e.target.closest(".term");if(term){showPop(term);e.stopPropagation();}
});
$("#view").addEventListener("keydown",e=>{
  const tab=e.target.closest(".tab");if(!tab)return;
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const tabs=[...tab.parentNode.children];let i=tabs.indexOf(tab)+(e.key==="ArrowRight"?1:-1);i=(i+tabs.length)%tabs.length;selectTab(tabs[i]);tabs[i].focus();
});
function selectTab(tab){const list=tab.parentNode;[...list.children].forEach(t=>{const on=t===tab;t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute("aria-controls")).hidden=!on;});}
if(typeof fs!=="number"||fs<0||fs>2)fs=0;
function applyFs(){document.documentElement.style.setProperty("--fs",FS[fs]);const m=$("#fsMinus"),p=$("#fsPlus");if(m)m.disabled=fs===0;if(p)p.disabled=fs===FS.length-1;}

/* ---------- glossary ---------- */
function glossify(root){
  const done=new Set();
  const keys=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
  const re=new RegExp("(?<![\\p{L}])("+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\p{L}])","u");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest("h2,h3,a,button,pre,.term,.big")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let node=n;
    while(node){const m=re.exec(node.nodeValue);if(!m)break;const k=m[1];
      if(done.has(k)){ // skip this occurrence, continue after it
        const after=node.splitText(m.index+k.length);node=after;continue;}
      done.add(k);const mid=node.splitText(m.index);const after=mid.splitText(k.length);
      const b=document.createElement("button");b.className="term";b.type="button";b.dataset.term=k;b.textContent=k;b.setAttribute("aria-label",k+", пояснення скорочення");
      mid.replaceWith(b);node=after;}
  });
}
let popFor=null;
function showPop(el){
  const pop=$("#pop");if(popFor===el&&!pop.hidden){closePop();return;}
  pop.innerHTML="<b>"+el.dataset.term+"</b>"+GLOSS[el.dataset.term];pop.hidden=false;popFor=el;
  const r=el.getBoundingClientRect(),w=Math.min(300,window.innerWidth-24);
  let left=r.left+window.scrollX;left=Math.min(left,window.scrollX+window.innerWidth-w-12);left=Math.max(window.scrollX+12,left);
  pop.style.left=left+"px";pop.style.top=(r.bottom+window.scrollY+8)+"px";pop.style.maxWidth=w+"px";
}
function closePop(){$("#pop").hidden=true;popFor=null;}
document.addEventListener("click",e=>{if(!e.target.closest(".term")&&!e.target.closest("#pop"))closePop();});
$("#view").addEventListener("mouseover",e=>{const t=e.target.closest(".term");if(t&&matchMedia("(hover:hover)").matches)showPop(t);});
$("#view").addEventListener("mouseout",e=>{const t=e.target.closest(".term");if(t&&matchMedia("(hover:hover)").matches)closePop();});

/* ---------- search ---------- */
function search(q){
  const nq=norm(q.trim());if(nq.length<2)return null;
  const words=nq.split(/\s+/).filter(Boolean);
  const res=[];
  SUBS.forEach(s=>{
    const nt=norm(s.title);let score=0,snippet="";
    const hay=s.id?norm(s.text):"";
    words.forEach(w=>{if(nt.includes(w))score+=5;if(hay.includes(w))score+=1+Math.min(3,hay.split(w).length-2);if(s.num.startsWith(w))score+=6;if(norm(s.part.title).includes(w))score+=1;});
    if(!score)return;
    if(s.id){const i=hay.indexOf(words[0]);if(i>=0){const st=Math.max(0,i-50),raw=s.text.slice(st,i+90);snippet=(st?"…":"")+raw+"…";}}
    res.push({s,score,snippet});
  });
  res.sort((a,b)=>(b.s.id?1:0)-(a.s.id?1:0)||b.score-a.score);
  return {res:res.slice(0,8),words};
}
function hl(text,words){let t=text.replace(/&/g,"&amp;").replace(/</g,"&lt;");words.forEach(w=>{if(w.length<2)return;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/'/g,"['’ʼ]")+")","giu");t=t.replace(re,"<mark>$1</mark>");});return t;}
function setupSearch(input,box,wrap){
  let sel=-1,items=[];
  function close(){box.hidden=true;input.setAttribute("aria-expanded","false");sel=-1;}
  function draw(){
    const r=search(input.value);
    if(!r){close();return;}
    items=r.res;
    box.innerHTML=r.res.length?'<div class="results-head">Знайдено: '+r.res.length+'</div>'+r.res.map((x,i)=>'<button class="res'+(x.s.id?'':' locked')+'" role="option" aria-selected="false" data-i="'+i+'"><span class="n">'+x.s.num+'</span><span><div class="t">'+hl(x.s.title,r.words)+(x.s.id?'':' · у розробці')+'</div><div class="s">'+(x.snippet?hl(x.snippet,r.words):x.s.part.n+". "+x.s.part.title)+'</div></span></button>').join(""):'<div class="res-empty">Нічого не знайдено. Спробуйте інше слово, наприклад «ВЛК», «контракт» або «резерв».</div>';
    box.hidden=false;input.setAttribute("aria-expanded","true");sel=-1;
  }
  function pick(i){const x=items[i];if(!x)return;if(!x.s.id){toast("Підрозділ "+x.s.num+" у розробці. Його текст з’явиться в робочій версії пам’ятки.");return;}close();input.value="";input.blur();exitSearchMode();navigate(x.s.id);}
  input.addEventListener("input",draw);
  input.addEventListener("focus",()=>{if(input.value)draw();});
  input.addEventListener("keydown",e=>{
    const opts=[...box.querySelectorAll(".res")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!opts.length)return;e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;opts.forEach((o,i)=>o.setAttribute("aria-selected",i===sel));opts[sel].scrollIntoView({block:"nearest"});}
    else if(e.key==="Enter"){e.preventDefault();pick(sel<0?0:sel);}
    else if(e.key==="Escape"){close();input.blur();exitSearchMode();}
  });
  box.addEventListener("click",e=>{const b=e.target.closest(".res");if(b)pick(+b.dataset.i);});
  document.addEventListener("click",e=>{if(!wrap.contains(e.target)&&!e.target.closest("#searchToggle"))close();});
}
setupSearch($("#q"),$("#qResults"),$("#topSearch"));
function enterSearchMode(){$("#bar").classList.add("searching");$("#searchClose").hidden=false;$("#q").focus();}
function exitSearchMode(){$("#bar").classList.remove("searching");$("#searchClose").hidden=true;}
$("#searchToggle").addEventListener("click",enterSearchMode);
$("#searchClose").addEventListener("click",()=>{$("#q").value="";$("#qResults").hidden=true;exitSearchMode();});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!e.target.closest("input,textarea,select")){e.preventDefault();if(matchMedia("(max-width:720px)").matches)enterSearchMode();else $("#q").focus();}
  if(e.key==="Escape"){closePop();closeDrawer();}
});

/* ---------- drawer ---------- */
let lockY=0;
function openDrawer(){
  const side=$("#side");if(side.classList.contains("open"))return;
  lockY=window.scrollY;document.body.style.top=(-lockY)+"px";document.body.classList.add("drawer-open");
  side.classList.add("open");side.scrollTop=0;$("#scrim").hidden=false;$("#burger").setAttribute("aria-expanded","true");
  setTimeout(()=>{const c=$("#sideClose");if(c)c.focus({preventScroll:true});},60);
}
function closeDrawer(){
  const side=$("#side"),was=side.classList.contains("open");
  side.classList.remove("open");$("#scrim").hidden=true;$("#burger").setAttribute("aria-expanded","false");
  if(was){document.body.classList.remove("drawer-open");document.body.style.top="";window.scrollTo(0,lockY);}
}
$("#sideClose").addEventListener("click",closeDrawer);
$("#burger").addEventListener("click",()=>$("#side").classList.contains("open")?closeDrawer():openDrawer());
$("#scrim").addEventListener("click",closeDrawer);

/* ---------- copy / toast ---------- */
let tt;
function toast(msg,fallback){
  const t=$("#toast");t.innerHTML="";const s=document.createElement("span");s.textContent=msg;t.appendChild(s);
  if(fallback){const i=document.createElement("input");i.value=fallback;i.readOnly=true;i.setAttribute("aria-label","Текст для копіювання");t.appendChild(i);setTimeout(()=>{i.focus();i.select();},30);}
  t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},fallback?9000:3200);
}
function copyText(text,okMsg){
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),()=>toast("Скопіюйте вручну:",text));}
  catch(e){toast("Скопіюйте вручну:",text);}
}
$("#hotlineBtn").addEventListener("click",()=>copyText("0 800 308 100","Номер гарячої лінії скопійовано: 0 800 308 100"));

/* ---------- report dialog ---------- */
const dlg=$("#reportDlg");
function openReport(){
  const id=currentId();$("#rSection").value=id?BYID[id].num+" "+BYID[id].title:"Загальне питання";
  $("#rText").value="";$("#rContact").value="";$("#rErr").hidden=true;
  const sel=window.getSelection?String(window.getSelection()).trim():"";if(sel&&sel.length<400)$("#rText").value="«"+sel+"»\n";
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
  setTimeout(()=>$("#rText").focus(),40);
}
$("#rCancel").addEventListener("click",()=>dlg.close());
$("#reportForm").addEventListener("submit",e=>{
  e.preventDefault();
  if($("#rText").value.trim().length<5){$("#rErr").hidden=false;$("#rText").focus();return;}
  dlg.close();toast("Дякуємо! У робочій версії повідомлення отримають юристи. У прототипі воно нікуди не надсилається.");
});

/* ---------- progress ---------- */
function updateProgress(){
  const art=$("#art"),bar=$("#prog");if(!art){bar.style.width="0";return;}
  const r=art.getBoundingClientRect(),h=r.height-window.innerHeight*0.6;const p=Math.min(1,Math.max(0,-r.top/(h>0?h:1)));bar.style.width=(p*100)+"%";
}
window.addEventListener("scroll",updateProgress,{passive:true});
window.addEventListener("resize",()=>{closePop();if(!matchMedia("(max-width:960px)").matches)closeDrawer();});

applyFs();
render();
})();
